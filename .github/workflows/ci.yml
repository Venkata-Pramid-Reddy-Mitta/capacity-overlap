name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (no evidence extra, so a broken core import is not masked)
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests experiments tools
          ruff format --check src tests experiments tools

      - name: Tests (own step, so a failure is not buried in the metrics collector)
        run: |
          python -m pytest -q --junitxml=junit.xml \
            --cov=capacity_overlap --cov-report=xml --cov-report=json --cov-report=term-missing

      - name: Coverage floor
        run: python tools/check_coverage.py --floor 95

      - name: Experiments (re-run from scratch)
        run: make experiments

      - name: Receipts (re-measure, then fail on any stale figure)
        run: |
          python tools/collect_metrics.py --skip-tests
          python tools/check_numbers.py

      - name: The awkward table, where a human will read it
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          m = json.loads(pathlib.Path("docs/metrics.json").read_text())["metrics"]
          print("### capacity-overlap: the uncomfortable numbers\n")
          print("| figure | value |")
          print("| --- | --- |")
          for k in ["hidden_over_person_days", "total_over_person_days", "hidden_share_pct",
                    "green_conflicted_pairs", "people_conflicted_while_green",
                    "hidden_at_quarter_fte_tolerance", "tests_total", "coverage_line_pct"]:
              print(f"| {k} | {m[k]} |")
          PY

      - name: Upload experiment JSON and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-py${{ matrix.python-version }}
          path: |
            docs/experiments/*.json
            docs/metrics.json
            coverage.xml
